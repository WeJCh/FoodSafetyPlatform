server:
  port: 8083

spring:
  application:
    name: query-service
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_query_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

warning:
  internal:
    # 与 warning-service 使用同一环境变量 WARNING_INTERNAL_TOKEN，确保调用内部统计接口通过鉴权。
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}

query:
  warning-stats:
    cache:
      # 预留缓存开关：当前默认关闭，后续可启用 30s 本地缓存。
      enabled: ${WARNING_STATS_CACHE_ENABLED:false}
      ttl-seconds: ${WARNING_STATS_CACHE_TTL_SECONDS:30}
