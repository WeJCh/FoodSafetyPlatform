server:
  port: 8086

spring:
  application:
    name: regulation-operation-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_regulation_operation_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "foodUserServiceJwtSecretKey123456"
  expiration-minutes: 120

regulation:
  internal:
    token: ${REGULATION_INTERNAL_TOKEN:regulation-internal-token}
  cache:
    public-data:
      enabled: ${OPERATION_PUBLIC_CACHE_ENABLED:true}
      list-ttl-seconds: ${OPERATION_PUBLIC_LIST_CACHE_TTL_SECONDS:60}
      detail-ttl-seconds: ${OPERATION_PUBLIC_DETAIL_CACHE_TTL_SECONDS:300}
      lock-lease-seconds: ${OPERATION_PUBLIC_CACHE_LOCK_LEASE_SECONDS:5}
  rectification:
    sla:
      scan-ms: ${RECTIFICATION_SLA_SCAN_MS:300000}
  warning:
    outbox:
      retry-scan-ms: ${REG_WARNING_OUTBOX_RETRY_SCAN_MS:15000}
      retry-initial-delay-ms: ${REG_WARNING_OUTBOX_RETRY_INITIAL_DELAY_MS:15000}
      retry-batch-size: ${REG_WARNING_OUTBOX_RETRY_BATCH_SIZE:50}
      max-retry: ${REG_WARNING_OUTBOX_MAX_RETRY:8}
      backoff-base-seconds: ${REG_WARNING_OUTBOX_BACKOFF_BASE_SECONDS:30}
      backoff-max-seconds: ${REG_WARNING_OUTBOX_BACKOFF_MAX_SECONDS:1800}

warning:
  internal:
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}

operation:
  lock:
    wait-seconds: ${OPERATION_LOCK_WAIT_SECONDS:0}
    lease-seconds: ${OPERATION_LOCK_LEASE_SECONDS:15}
  scheduler:
    lock:
      wait-seconds: ${OPERATION_SCHEDULER_LOCK_WAIT_SECONDS:0}
      rectification-sla-lease-seconds: ${RECTIFICATION_SLA_SCHEDULER_LOCK_LEASE_SECONDS:480}
      warning-outbox-retry-lease-seconds: ${WARNING_OUTBOX_RETRY_SCHEDULER_LOCK_LEASE_SECONDS:60}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
