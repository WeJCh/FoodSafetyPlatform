server:
  port: 8083

spring:
  application:
    name: query-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_query_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

warning:
  internal:
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}

query:
  cache:
    scope:
      enabled: ${QUERY_SCOPE_CACHE_ENABLED:true}
      ttl-seconds: ${QUERY_SCOPE_CACHE_TTL_SECONDS:600}
      lock-lease-seconds: ${QUERY_SCOPE_CACHE_LOCK_LEASE_SECONDS:5}
    supervision-overview:
      enabled: ${QUERY_SUPERVISION_OVERVIEW_CACHE_ENABLED:true}
      ttl-seconds: ${QUERY_SUPERVISION_OVERVIEW_CACHE_TTL_SECONDS:20}
      lock-lease-seconds: ${QUERY_SUPERVISION_OVERVIEW_CACHE_LOCK_LEASE_SECONDS:5}
  warning-stats:
    cache:
      enabled: ${QUERY_WARNING_STATS_CACHE_ENABLED:false}
      ttl-seconds: ${QUERY_WARNING_STATS_CACHE_TTL_SECONDS:30}
  rate-limit:
    warning-stats:
      enabled: ${QUERY_WARNING_STATS_RATE_LIMIT_ENABLED:true}
      fail-open: ${QUERY_WARNING_STATS_RATE_LIMIT_FAIL_OPEN:true}
      window-seconds: ${QUERY_WARNING_STATS_RATE_LIMIT_WINDOW_SECONDS:60}
      max-requests: ${QUERY_WARNING_STATS_RATE_LIMIT_MAX_REQUESTS:120}
    supervision-overview:
      enabled: ${QUERY_SUPERVISION_OVERVIEW_RATE_LIMIT_ENABLED:true}
      fail-open: ${QUERY_SUPERVISION_OVERVIEW_RATE_LIMIT_FAIL_OPEN:true}
      window-seconds: ${QUERY_SUPERVISION_OVERVIEW_RATE_LIMIT_WINDOW_SECONDS:60}
      max-requests: ${QUERY_SUPERVISION_OVERVIEW_RATE_LIMIT_MAX_REQUESTS:120}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
