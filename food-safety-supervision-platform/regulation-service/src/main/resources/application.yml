server:
  port: 8082

spring:
  application:
    name: regulation-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_regulation_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "foodUserServiceJwtSecretKey123456"
  expiration-minutes: 120

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.142.133:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:complaints}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://192.168.142.133:9000}

regulation:
  internal:
    token: ${REGULATION_INTERNAL_TOKEN:regulation-internal-token}
  cache:
    region:
      enabled: ${REGULATION_REGION_CACHE_ENABLED:true}
      ttl-seconds: ${REGULATION_REGION_CACHE_TTL_SECONDS:86400}
      lock-lease-seconds: ${REGULATION_REGION_CACHE_LOCK_LEASE_SECONDS:5}
    master-data:
      enabled: ${REGULATION_MASTER_CACHE_ENABLED:true}
      ttl-seconds: ${REGULATION_MASTER_CACHE_TTL_SECONDS:600}
      lock-lease-seconds: ${REGULATION_MASTER_CACHE_LOCK_LEASE_SECONDS:5}
    public-data:
      enabled: ${REGULATION_PUBLIC_CACHE_ENABLED:true}
      list-ttl-seconds: ${REGULATION_PUBLIC_LIST_CACHE_TTL_SECONDS:60}
      detail-ttl-seconds: ${REGULATION_PUBLIC_DETAIL_CACHE_TTL_SECONDS:300}
      lock-lease-seconds: ${REGULATION_PUBLIC_CACHE_LOCK_LEASE_SECONDS:5}
  rectification:
    sla:
      scan-ms: ${RECTIFICATION_SLA_SCAN_MS:300000}
  warning:
    outbox:
      retry-scan-ms: ${REG_WARNING_OUTBOX_RETRY_SCAN_MS:15000}
      retry-initial-delay-ms: ${REG_WARNING_OUTBOX_RETRY_INITIAL_DELAY_MS:15000}
      retry-batch-size: ${REG_WARNING_OUTBOX_RETRY_BATCH_SIZE:50}
      max-retry: ${REG_WARNING_OUTBOX_MAX_RETRY:8}
      backoff-base-seconds: ${REG_WARNING_OUTBOX_BACKOFF_BASE_SECONDS:30}
      backoff-max-seconds: ${REG_WARNING_OUTBOX_BACKOFF_MAX_SECONDS:1800}
  rate-limit:
    presign:
      enabled: ${REGULATION_PRESIGN_RATE_LIMIT_ENABLED:true}
      fail-open: ${REGULATION_PRESIGN_RATE_LIMIT_FAIL_OPEN:true}
      window-seconds: ${REGULATION_PRESIGN_RATE_LIMIT_WINDOW_SECONDS:60}
      max-requests: ${REGULATION_PRESIGN_RATE_LIMIT_MAX_REQUESTS:20}

warning:
  internal:
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}

user:
  internal:
    token: ${USER_INTERNAL_TOKEN:user-internal-token}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
