server:
  port: 8084

spring:
  application:
    name: warning-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_warning_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

warning:
  scheduler:
    lock:
      wait-seconds: ${WARNING_SCHEDULER_LOCK_WAIT_SECONDS:0}
      escalation-lease-seconds: ${WARNING_ESCALATION_SCHEDULER_LOCK_LEASE_SECONDS:300}
      archive-lease-seconds: ${WARNING_ARCHIVE_SCHEDULER_LOCK_LEASE_SECONDS:900}
  lock:
    wait-seconds: ${WARNING_LOCK_WAIT_SECONDS:0}
    lease-seconds: ${WARNING_LOCK_LEASE_SECONDS:15}
  cache:
    stats:
      enabled: ${WARNING_STATS_CACHE_ENABLED:true}
      ttl-seconds: ${WARNING_STATS_CACHE_TTL_SECONDS:30}
      lock-lease-seconds: ${WARNING_STATS_CACHE_LOCK_LEASE_SECONDS:5}
  internal:
    # 与 query-service 使用同一环境变量 WARNING_INTERNAL_TOKEN，确保内部统计/事件接口鉴权一致。
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}
  escalation:
    enabled: ${WARNING_ESCALATION_ENABLED:true}
    scan-ms: ${WARNING_ESCALATION_SCAN_MS:30000}
    initial-delay-ms: ${WARNING_ESCALATION_INITIAL_DELAY_MS:60000}
    rectification-l2-minutes: ${WARNING_ESCALATION_RECTIFICATION_L2_MINUTES:10}
  archive:
    enabled: ${WARNING_ARCHIVE_ENABLED:true}
    scan-ms: ${WARNING_ARCHIVE_SCAN_MS:600000}
    initial-delay-ms: ${WARNING_ARCHIVE_INITIAL_DELAY_MS:120000}
    resolved-days: ${WARNING_ARCHIVE_RESOLVED_DAYS:7}
    batch-size: ${WARNING_ARCHIVE_BATCH_SIZE:100}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
