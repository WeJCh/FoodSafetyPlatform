server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
    gateway:
      discovery:
        locator:
          enabled: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "http://localhost:5173"
              - "http://localhost:5174"
              - "http://127.0.0.1:5173"
              - "http://127.0.0.1:5174"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            allow-credentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
        - id: user-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**
        - id: user-account
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
        - id: user-roles
          uri: lb://user-service
          predicates:
            - Path=/api/roles/**
        - id: user-admin
          uri: lb://user-service
          predicates:
            - Path=/api/admin/**
        - id: regulation-operation-service
          uri: lb://regulation-operation-service
          predicates:
            - Path=/api/regulation-operation/**
        - id: regulation-service
          uri: lb://regulation-service
          predicates:
            - Path=/api/regulation/**
        - id: regulation-files
          uri: lb://regulation-service
          predicates:
            - Path=/api/files/**
        - id: complaint-service
          uri: lb://complaint-service
          predicates:
            - Path=/api/complaints/**
        - id: query-service
          uri: lb://query-service
          predicates:
            - Path=/api/query/**
        - id: warning-service
          uri: lb://warning-service
          predicates:
            - Path=/api/warning/**

jwt:
  secret: "foodUserServiceJwtSecretKey123456"

gateway:
  auth:
    # Introspect timeout in milliseconds to avoid blocking the gateway when user-service is slow.
    introspect-timeout-ms: 1500
    # Strict by default. Enable fail-open only via env var for temporary troubleshooting.
    introspect-fail-open: ${GATEWAY_AUTH_INTROSPECT_FAIL_OPEN:false}
  rate-limit:
    login:
      enabled: ${GATEWAY_LOGIN_RATE_LIMIT_ENABLED:true}
      fail-open: ${GATEWAY_LOGIN_RATE_LIMIT_FAIL_OPEN:true}
      ip-window-seconds: ${GATEWAY_LOGIN_RATE_LIMIT_IP_WINDOW_SECONDS:60}
      ip-max-requests: ${GATEWAY_LOGIN_RATE_LIMIT_IP_MAX_REQUESTS:10}
      user-window-seconds: ${GATEWAY_LOGIN_RATE_LIMIT_USER_WINDOW_SECONDS:600}
      user-max-requests: ${GATEWAY_LOGIN_RATE_LIMIT_USER_MAX_REQUESTS:5}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
