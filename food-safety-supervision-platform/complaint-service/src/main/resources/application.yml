server:
  port: 8085

spring:
  application:
    name: complaint-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      config:
        import-check:
          enabled: false
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_complaint_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

regulation:
  internal:
    token: ${REGULATION_INTERNAL_TOKEN:regulation-internal-token}

warning:
  internal:
    token: ${WARNING_INTERNAL_TOKEN:warning-internal-token}

complaint:
  lock:
    wait-seconds: ${COMPLAINT_LOCK_WAIT_SECONDS:0}
    lease-seconds: ${COMPLAINT_LOCK_LEASE_SECONDS:15}
  rate-limit:
    public-submit:
      enabled: ${COMPLAINT_PUBLIC_SUBMIT_RATE_LIMIT_ENABLED:true}
      fail-open: ${COMPLAINT_PUBLIC_SUBMIT_RATE_LIMIT_FAIL_OPEN:true}
      window-seconds: ${COMPLAINT_PUBLIC_SUBMIT_RATE_LIMIT_WINDOW_SECONDS:600}
      max-requests: ${COMPLAINT_PUBLIC_SUBMIT_RATE_LIMIT_MAX_REQUESTS:5}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
