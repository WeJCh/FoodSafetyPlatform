server:
  port: 8081

spring:
  application:
    name: user-service
  data:
    redis:
      host: ${REDIS_HOST:192.168.142.133}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8080}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/food_user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "foodUserServiceJwtSecretKey123456"
  expiration-minutes: 120

user:
  internal:
    token: ${USER_INTERNAL_TOKEN:user-internal-token}

platform:
  redis:
    key-prefix: ${PLATFORM_REDIS_KEY_PREFIX:fsp}
    env: ${PLATFORM_REDIS_ENV:dev}
